name: 10-Minute Jinhak Crawler

on:
  schedule:
    # 10분마다 자동 실행 (Cron 표현식: 분 시 일 월 요일)
    - cron: '*/10 * * * *'
  workflow_dispatch: # GitHub 웹사이트에서 버튼 눌러 수동 실행 가능하도록 설정

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소의 코드 가져오기
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 파이썬 실행 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 크롤링에 필요한 파이썬 라이브러리 설치
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install `requests pandas lxml html5lib openpyxl

      # 4. main.py 실행 (구글 시트 적재)
      - name: Run Main Crawler
        run: |
          python main.py